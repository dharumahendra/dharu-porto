<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Dharu</title>
    <!-- Aeonik is the body face. The two weights nearly every screen uses are
         fetched alongside the HTML instead of waiting for the CSS to ask. -->
    <link rel="preload" href="/fonts/aeonik/Aeonik-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/aeonik/Aeonik-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <!-- General Sans (Fontshare) — the oversized section words: dharu, crafts,
         contact, studio. Loaded without blocking render: the stylesheet starts
         as print-only, which the browser fetches at low priority and doesn't
         wait for, then switches to all media once it lands. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
